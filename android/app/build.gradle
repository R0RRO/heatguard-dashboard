plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.heatguard.clip'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.heatguard.clip'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // prototipo: firma de depuración para instalar directo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
