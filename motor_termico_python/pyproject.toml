[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatguard-backend"
version = "0.31.0"
description = "HeatGuard Clip stable software prototype: BLE durable, exposición persistente y supervisión trazable"
requires-python = ">=3.10"

[project.optional-dependencies]
ble = ["bleak>=0.22,<4"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
wbgt = ["lwbgt>=1.2,<2"]
ml = ["scikit-learn==1.8.0", "numpy>=1.26,<3", "pandas>=2.2,<4", "joblib>=1.3,<2"]
research = ["matplotlib>=3.7,<4", "pandas>=2.2,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
full = ["bleak>=0.22,<4", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "lwbgt>=1.2,<2", "scikit-learn==1.8.0", "numpy>=1.26,<3", "pandas>=2.2,<4", "joblib>=1.3,<2", "matplotlib>=3.7,<4"]

[project.scripts]
heatguard-evaluate = "heatguard.__main__:main"

[tool.setuptools.packages.find]
include = ["heatguard*"]

[tool.setuptools.package-data]
heatguard = ["static/*.html"]
